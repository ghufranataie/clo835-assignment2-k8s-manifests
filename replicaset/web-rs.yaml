apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-rs
  namespace: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employees
  template:
    metadata:
      labels:
        app: employees
    spec:
      containers:
        - name: web
          image: 524714122815.dkr.ecr.us-east-1.amazonaws.com/app:latest
          ports:
            - containerPort: 8080
          env:
            - name: DBHOST
              value: mysql-service.mysql.svc.cluster.local  # MySQL service DNS
            - name: DBPORT
              value: "3306"
            - name: DATABASE
              value: employees
            - name: DBUSER
              value: root
            - name: DBPWD
              value: password
      imagePullSecrets:
        - name: ecr-secret