apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-rs
  namespace: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employees
  template:
    metadata:
      labels:
        app: employees
    spec:
      containers:
        - name: web
          image: 524714122815.dkr.ecr.us-east-1.amazonaws.com/app:v1
          ports:
            - containerPort: 8080
      imagePullSecrets:
        - name: ecr-registry