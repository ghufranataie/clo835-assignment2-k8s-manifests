apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-rs
  namespace: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employees
  template:
    metadata:
      labels:
        app: employees
    spec:
      containers:
        - name: web
          image: 524714122815.dkr.ecr.us-east-1.amazonaws.com/app:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "mysql-service.mysql.svc.cluster.local"   # MySQL service DNS
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "employees"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "password"
      imagePullSecrets:
        - name: ecr-registry