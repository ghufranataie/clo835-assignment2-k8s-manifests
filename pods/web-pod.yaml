apiVersion: v1
kind: Pod
metadata:
  name: web-pod
  namespace: web
  labels:
    app: employees
spec:
  containers:
    - name: web
      image: 524714122815.dkr.ecr.us-east-1.amazonaws.com/app:latest
      ports:
        - containerPort: 8080
      env:
        - name: DB_HOST
          value: "mysql-service.mysql.svc.cluster.local"   # MySQL service DNS
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "employees"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "Gh@4615123"
  imagePullSecrets:
    - name: ecr-secret