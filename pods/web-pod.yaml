apiVersion: v1
kind: Pod
metadata:
  name: web-pod
  namespace: web
  labels:
    app: employees
spec:
  containers:
    - name: web
      image: 524714122815.dkr.ecr.us-east-1.amazonaws.com/app:latest
      ports:
        - containerPort: 8080
      env:
        - name: DBHOST
          value: mysql-service.mysql.svc.cluster.local
        - name: DBPORT
          value: "3306"
        - name: DATABASE
          value: employees
        - name: DBUSER
          value: root
        - name: DBPWD
          value: password
  imagePullSecrets:
    - name: ecr-secret