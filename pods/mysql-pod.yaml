apiVersion: v1
kind: Pod
metadata:
  name: mysql-pod
  labels:
    app: mysql
spec:
  containers:
  - name: mysql
    image: 524714122815.dkr.ecr.us-east-1.amazonaws.com/db:latest
    ports:
    - containerPort: 3306
    env:
      - name: MYSQL_ROOT_PASSWORD
        value: "Gh@4615123"
  imagePullSecrets:
    - name: ecr-registry